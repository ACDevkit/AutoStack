name: Release

on:
  push:
    tags:
      - "v*"

# Only one release job runs at a time; cancel any in-progress run for the
# same tag if a new push arrives.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write   # required to create the GitHub Release

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest   # Apple Silicon + Intel via universal binary
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node 20 ─────────────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: autostack/package-lock.json

      # ── Rust stable ─────────────────────────────────────────────────────────
      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary needs both targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Cache the Cargo registry and build artefacts to speed up subsequent runs
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: autostack/src-tauri

      # ── Linux system dependencies ────────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # ── npm install ──────────────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: autostack
        run: npm ci

      # ── Build & release ──────────────────────────────────────────────────────
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: autostack
          tagName: ${{ github.ref_name }}          # e.g. v0.1.0
          releaseName: "AutoStack ${{ github.ref_name }}"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true      # review the release before publishing
          prerelease: false
          args: ${{ matrix.args }}
